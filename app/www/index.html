<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1d38">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Rooftop Rumble</title>
<style>@font-face{font-family:'Press Start 2P';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/press-start-2p-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Pixelify Sans';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/pixelify-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Pixelify Sans';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Aref Ruqaa';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2) format('woff2')}@font-face{font-family:'Jersey 10';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jersey-10-latin-400-normal.woff2) format('woff2')}</style>
<style>
/* Layout: letterboxed 800x450 stage on a full-bleed canvas; fighting-game HUD on top; touch pad at the bottom; one scrollable card for menus, lobby, select screens and results. Single night-blue theme by choice. */
:root{
  --night:#0f1d38;
  --panel:#16294d;
  --panel2:#1d3460;
  --fg:#f6f1e7;
  --muted:#8ea3c7;
  --gold:#f2c14e;
  --hurt:#e8384f;
  --ok:#5fd38d;
  --p1:#7fb6ff;
  --p2:#ff9a52;
  --display:"Press Start 2P",ui-monospace,monospace;
  --body:"Jersey 10","Pixelify Sans",ui-monospace,monospace;
  --arabic:"Aref Ruqaa",serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--fg);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 50%,var(--vig,transparent) 100%)}
#px,#fg{position:fixed;left:0;top:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;transform-origin:0 0}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;pointer-events:none;max-width:900px;margin-inline:auto;text-shadow:0 0 3px var(--night),0 2px 0 var(--night),0 0 8px var(--night)}
.side{display:grid;gap:4px;min-width:0}
.side.r{text-align:right}
.name{font-family:var(--display);font-size:13px;line-height:1.2;letter-spacing:0;display:flex;gap:8px;align-items:center}
.name small{font-size:8px;color:var(--fg);opacity:.8}
.r .name{justify-content:flex-end}
.pips{display:flex;gap:4px}
.pip{width:10px;height:10px;border:2px solid var(--muted);transform:rotate(45deg);display:block}
.pip.on{background:var(--gold);border-color:var(--gold)}
.bar{height:16px;background:var(--panel);border:3px solid var(--fg);box-shadow:3px 3px 0 #000;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:100%}
.r .bar i{left:auto;right:0}
.bar .lag{background:var(--hurt)}
.bar .hp{background:var(--gold)}
.meter{height:7px;background:var(--panel);position:relative;width:60%;border:1px solid var(--muted)}
.r .meter{margin-left:auto}
.meter i{position:absolute;top:0;bottom:0;left:0;background:var(--p1)}
.r .meter i{left:auto;right:0;background:var(--p2)}
.meter b{position:absolute;top:-1px;bottom:-1px;left:50%;width:2px;background:var(--fg)}
.meter.half i{animation:glow .5s ease-in-out infinite alternate}
.meter.full i{background:var(--gold)!important;animation:glow .2s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.timer{font-family:var(--display);font-size:26px;line-height:1.1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.pausebtn{box-shadow:3px 3px 0 #000;position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);width:44px;height:30px;border:2px solid var(--muted);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--fg);font-family:var(--display);font-size:11px;line-height:1;cursor:pointer;padding:0}
body.cine .pausebtn,body.cine .traininfo{visibility:hidden}
.pausebtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.traininfo{font-family:var(--display);font-size:8px!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.06em;color:var(--fg);background:color-mix(in srgb,var(--night) 70%,transparent);padding:4px 10px;white-space:nowrap;pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.traininfo b{color:var(--gold);font-weight:700}
.net{font-family:var(--display);font-size:7px;color:var(--ok);text-align:center;margin-top:2px;letter-spacing:.08em}

#card{position:fixed;inset:0;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--night) 72%,transparent);display:flex;touch-action:pan-y}
.panelx{border:4px solid #000;box-shadow:8px 8px 0 #000;margin:auto;width:100%;max-width:48rem;display:grid;gap:14px;text-align:center;background:var(--panel);padding:30px 20px 22px;position:relative}
.panelx::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,#1c63b0 0 14px,#f2c14e 14px 28px,#2f8a5b 28px 42px,#f6efe3 42px 56px,#c8102e 56px 70px)}
.ar{font-family:var(--arabic);font-size:30px;line-height:1;color:var(--gold);direction:rtl}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,44px);line-height:1.15;margin:0;letter-spacing:0;text-shadow:4px 4px 0 #000;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3;margin:0;letter-spacing:0;text-shadow:3px 3px 0 #000}
.panelx p{margin:0 auto;color:var(--muted);font-size:17px;line-height:1.4;max-width:34rem}
.panelx p.warn{color:var(--hurt)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;font-size:17px;margin:0 auto;max-width:32rem}
.keys dt{font-family:var(--display);font-size:11px;color:var(--gold);line-height:1.1;white-space:nowrap}
.keys dd{margin:0;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media (min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}.grid .pick b{font-size:10px}.grid .pick small{font-size:12px}}
.grid .pick{overflow:hidden}
.grid.st{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;align-content:start;background:var(--panel2);padding:8px 8px 10px;border:2px solid transparent;text-align:left;min-width:0}
.pick canvas{width:100%;height:auto;display:block;background:var(--night);image-rendering:pixelated}
.pick b{font-family:var(--display);font-size:11px;line-height:1.3;letter-spacing:0;font-weight:400}
.pick small{color:var(--muted);font-size:14px;line-height:1.2}
.pick:hover{border-color:var(--muted)}
.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pick.sel{border-color:var(--gold);background:#24406f}
.pick.dis{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.go{font:inherit;font-family:var(--display);font-size:14px;line-height:1.2;padding:12px 18px;box-shadow:4px 4px 0 #000;background:var(--gold);color:var(--night);border:0;cursor:pointer;letter-spacing:.04em}
button.go.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--muted)}
button.go:hover{background:var(--fg);color:var(--night)}
button.go:disabled{opacity:.4;cursor:not-allowed}
button.go:focus-visible{outline:3px solid var(--p1);outline-offset:3px}
.info{display:grid;gap:6px;text-align:left;background:var(--night);padding:12px 14px;font-size:16px;line-height:1.35}
.info b{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:0;line-height:1.4}
.info .m{color:var(--muted)}
.ml{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
.ml dt{font-family:var(--display);font-size:11px;line-height:1.15;color:var(--gold);white-space:nowrap}
.ml dd{margin:0;line-height:1.3}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel2);padding:14px 16px;display:grid;gap:4px;text-align:left;border:2px solid transparent}
.mode b{font-family:var(--display);font-size:16px;line-height:1.3;font-weight:400;letter-spacing:0}
.mode small{color:var(--muted);font-size:15px;line-height:1.3}
.mode:hover,.mode:focus-visible{border-color:var(--gold);outline:none}
.mode.dis{opacity:.5;cursor:not-allowed}
.qrbox{display:grid;gap:10px;justify-items:center}
.qrbox canvas{width:min(78vw,300px,62vh);height:auto;background:#fff;padding:0;image-rendering:pixelated}
.scan{position:relative;width:min(78vw,320px,58vh);aspect-ratio:1;background:#000;overflow:hidden}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;inset:14%;border:3px solid var(--gold);box-shadow:0 0 0 999px rgba(0,0,0,.35)}
textarea{font:13px/1.3 ui-monospace,Menlo,monospace;width:100%;min-height:72px;background:var(--night);color:var(--fg);border:2px solid var(--muted);padding:8px;resize:vertical;box-sizing:border-box;user-select:text;-webkit-user-select:text}
details{text-align:left;width:100%}
details summary{cursor:pointer;color:var(--muted);font-size:16px}
.setl{display:grid;gap:8px;max-width:22rem;width:100%;margin:0 auto}
.roomcode{font-family:var(--display);font-size:clamp(28px,9vh,52px);letter-spacing:.18em;color:var(--gold);text-shadow:4px 4px 0 #000;user-select:text;-webkit-user-select:text}
.roomin{font-family:var(--display);font-size:28px;letter-spacing:.2em;text-align:center;text-transform:uppercase;width:min(100%,14ch);margin:0 auto;padding:10px;background:var(--night);color:var(--gold);border:3px solid var(--muted);box-sizing:border-box;user-select:text;-webkit-user-select:text}
.roomin:focus{outline:3px solid var(--gold);outline-offset:2px}
.status{font-family:var(--display);font-size:12px;line-height:1.5;color:var(--gold);letter-spacing:.03em}

.pad{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.pad{--ps:1;--d:calc(clamp(40px,12.5vh,56px)*var(--ps));--b:calc(clamp(46px,14.5vh,62px)*var(--ps))}
.pad.lefty{flex-direction:row-reverse}
.dpad{display:grid;grid-template-columns:repeat(3,var(--d));grid-template-rows:repeat(3,var(--d));gap:2px;pointer-events:auto;touch-action:none;border-radius:50%;background:color-mix(in srgb,var(--night) 35%,transparent)}
.dpad span{pointer-events:none}
.dpad .hub{display:block;margin:22%;border-radius:50%;background:color-mix(in srgb,var(--panel) 60%,transparent);border:2px solid var(--muted)}
.btns{position:relative;width:calc(var(--b)*3.15);margin-left:calc(var(--b)*.1);height:calc(var(--b)*2.25);pointer-events:auto;touch-action:none}
.btns span{position:absolute;--s:1;width:calc(var(--b)*var(--s));height:calc(var(--b)*var(--s));left:calc(var(--b)*var(--x) + var(--b)*(1 - var(--s))/2);top:calc(var(--b)*var(--y) + var(--b)*(1 - var(--s))/2);pointer-events:none;transition:transform .05s}
.btns span.down{transform:scale(.9)}
.pad span{pointer-events:auto;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 72%,transparent);border:2px solid var(--muted);border-radius:50%;font-family:var(--display);font-size:16px;color:var(--fg);touch-action:none;box-shadow:3px 3px 0 #000}
.dpad span{border-radius:10px}
.pad span.down{background:var(--gold);color:var(--night);border-color:var(--gold)}
.btns span{line-height:1;gap:0;align-content:center}
.btns span small{font-family:var(--body);font-size:10px;letter-spacing:.06em;color:var(--muted)}
.pad span.down small{color:var(--night)}
.btns .g{border-radius:12px;font-size:9px;border-color:var(--gold)}
.btns .x{font-size:9px;line-height:1.1;border-color:var(--hurt);background:color-mix(in srgb,var(--hurt) 45%,transparent);animation:lbpulse .5s ease-in-out infinite alternate;will-change:opacity}
.btns .x small{color:var(--fg)}
@keyframes lbpulse{to{opacity:.6}}
.meter.art::after{content:attr(data-lb);position:absolute;top:9px;left:0;font-family:var(--display);font-size:7px;color:var(--hurt);white-space:nowrap;animation:glow .3s steps(2) infinite alternate}
.r .meter.art::after{left:auto;right:0}
.btns .s{border-color:var(--hurt)}
@media (max-height:520px){h1{font-size:clamp(20px,6vh,30px)}.ar{font-size:22px}h2{font-size:15px}.panelx{padding:20px 16px 16px;gap:10px}.mode{padding:10px 12px}.mode b{font-size:14px}.mode small{font-size:14px}.panelx p{font-size:15px}}

.sp,.acts{display:contents}
/* phones held sideways: every screen fits without scrolling the page; long lists scroll inside their own box */
@media (max-height:500px) and (orientation:landscape){
  #card{padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));overflow:hidden}
  .panelx{max-width:none;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:16px 14px 10px;border-width:3px;box-shadow:4px 4px 0 #000;overflow:hidden}
  .panelx::before{height:6px}
  .panelx>*{flex:none}
  .panelx p{font-size:13px;line-height:1.3}
  .panelx p.intro{display:none}
  .ar{font-size:18px}
  h1{font-size:clamp(18px,6vh,26px)}
  h2{font-size:13px;text-shadow:2px 2px 0 #000}
  .modes{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .mode{padding:10px 10px;gap:6px}
  .mode b{font-size:11px}
  .mode small{font-size:12px;line-height:1.25}
  .keys{grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;font-size:12px;max-width:none;width:100%}
  .keys dt{font-size:8px;align-self:center}
  .row{gap:8px}
  button.go{font-size:10px;padding:9px 14px;box-shadow:3px 3px 0 #000}
  .sp{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:10px;flex:1 1 auto;min-height:0}
  .sp>*{min-height:0}
  .sp .info,.sp .grid{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
  .info{font-size:13px;padding:8px 10px;gap:4px;align-content:start}
  .info b{font-size:10px}
  .ml{gap:2px 10px}.ml dt{font-size:8px;align-self:center}.ml dd{font-size:12px}
  .grid{gap:6px;align-content:start}
  .grid:not(.st){grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .grid:not(.st) .pick canvas{height:max(52px,calc((100vh - 168px)/2 - 20px));object-fit:cover;object-position:50% 25%}
  .grid.st{grid-template-columns:repeat(4,minmax(0,1fr))!important;flex:1 1 auto;min-height:0;overflow-y:auto}
  .grid.st .pick canvas{height:max(48px,calc((100vh - 150px)/2 - 26px));object-fit:cover}
  .pick{padding:4px 4px 6px;gap:3px}
  .pick b,.grid .pick b{font-size:clamp(6px,1.15vw,8px);white-space:nowrap}
  .keys.kb{display:none}
  .pick small{display:none}
  .sp2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .sp2 .acts{display:flex;flex-direction:column;justify-content:center;gap:8px}
  .sp2 .acts .row{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
  .status{font-size:9px}
  .qrbox canvas{width:min(46vh,300px)}
}

/* body text uses Jersey 10 (clear 3, 5, 7, 9 for Derja); it needs a bigger size than Pixelify to stay sharp */
.panelx p{font-size:19px}.mode small{font-size:18px}.info{font-size:19px}.ml dd{font-size:18px}.keys{font-size:19px}.pick small{font-size:17px}details summary{font-size:18px}
.ml dt{white-space:normal;max-width:11ch;line-height:1.5}
.btns span small{font-family:var(--display);font-size:7px;letter-spacing:0;margin-top:3px}
@media (max-height:500px) and (orientation:landscape){
  .panelx p{font-size:16px;line-height:1.25}.mode small{font-size:15px;line-height:1.2}.keys{font-size:15px}.info{font-size:16px}.ml dd{font-size:15px;line-height:1.2}
}
@media (pointer:fine){.pad{opacity:.85;transform:scale(.8);transform-origin:bottom center}.keys .tc{display:none}}
@media (pointer:coarse){.keys .kb{display:none}}
</style>

<canvas id="px" aria-hidden="true"></canvas><canvas id="fg" aria-hidden="true"></canvas><div id="vig"></div></head><body>
<canvas id="c" aria-label="Rooftop Rumble stage"></canvas>
<div class="hud" id="hud" hidden>
  <div class="side">
    <div class="name"><span id="n1"></span><small id="y1"></small><span class="pips" id="p1w"></span></div>
    <div class="bar"><i class="lag" id="p1lag"></i><i class="hp" id="p1hp"></i></div>
    <div class="meter" id="p1m"><i id="p1mi"></i><b></b></div>
  </div>
  <div><div class="timer" id="timer">60</div><div class="net" id="netlbl" hidden>WI-FI</div></div>
  <div class="side r">
    <div class="name"><span class="pips" id="p2w"></span><small id="y2"></small><span id="n2"></span></div>
    <div class="bar"><i class="lag" id="p2lag"></i><i class="hp" id="p2hp"></i></div>
    <div class="meter" id="p2m"><i id="p2mi"></i><b></b></div>
  </div>
</div>
<button class="pausebtn" id="pausebtn" type="button" aria-label="Pause" hidden>II</button>
<div class="traininfo" id="trainInfo" hidden></div>
<div class="pad" id="pad" hidden>
  <div class="dpad" id="dpad">
    <span style="grid-column:2;grid-row:1" data-k="up">▲</span>
    <span style="grid-column:1;grid-row:2" data-k="left">◀</span>
    <span style="grid-column:3;grid-row:2" data-k="right">▶</span>
    <span style="grid-column:2;grid-row:3" data-k="down">▼</span>
    <i class="hub" style="grid-column:2;grid-row:2"></i>
  </div>
  <div class="btns" id="btns">
    <span class="g" data-k="g" style="--x:-.04;--y:.1;--s:.8">GRAB</span>
    <span class="s" data-k="s" style="--x:-.04;--y:1.2;--s:.8">S</span>
    <span data-k="lp" style="--x:1.02;--y:.06">1<small>L PUNCH</small></span>
    <span data-k="rp" style="--x:2.16;--y:-.1">2<small>R PUNCH</small></span>
    <span data-k="lk" style="--x:.96;--y:1.2">3<small>L KICK</small></span>
    <span data-k="rk" style="--x:2.1;--y:1.04">4<small>R KICK</small></span>
    <span class="x" data-k="x" id="xbtn" style="--x:2.2;--y:-1.12;--s:.86" hidden>LAST<small>BREATH</small></span>
  </div>
</div>
<div id="card"><div class="panelx" id="panel"></div></div>

<script>
(()=>{
/* =====================================================================
   SETUP
   ===================================================================== */
const cv=document.getElementById('c'),$=id=>document.getElementById(id);
let ctx=cv.getContext('2d');const mctx=ctx;
const SW=800,SH=450,GROUND=392;
const NIGHT='#0f1d38',FG='#f6f1e7',GOLD='#f2c14e',RED='#c8102e',HURT='#e8384f',INK='#1d1410';
const NATIVE=!!window.RR_NATIVE;                         // set by the Android app build
const CAN_NET=NATIVE&&!!window.RTCPeerConnection&&typeof qrcode!=='undefined';
let S,OX,OY,dpr,FDT=.016;
function resize(){dpr=Math.min(devicePixelRatio||1,window.__DPR||2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;S=Math.min(innerWidth/SW,innerHeight/SH);OX=(innerWidth-SW*S)/2;OY=(innerHeight-SH*S)/2}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now()/1000;

/* =====================================================================
   INPUT
   Tekken layout: 1 = left punch (lp), 2 = right punch (rp),
   3 = left kick (lk), 4 = right kick (rk). s = special, g = throw.
   LOCAL = this device; REMOTE = the friend's phone (on the host).
   ===================================================================== */
const BUFFER=.2,DOUBLE_TAP=.28,LIMBS=['lp','rp','lk','rk'],BTN={lp:1,rp:2,lk:3,rk:4};
const mkInput=()=>({held:{},pressed:{},dbl:{},last:{},at:{},rel:{}});
const LOCAL=mkInput(),REMOTE=mkInput();
function press(st,k){const t=now();if(!st.held[k]){st.pressed[k]=BUFFER;st.at[k]=t;if(t-(st.last[k]||-9)<DOUBLE_TAP)st.dbl[k]=BUFFER;st.last[k]=t}st.held[k]=1}
function release(st,k){st.held[k]=0;st.rel[k]=now()}
function readInput(st,dt){const inp={...st.held,pressed:{},dbl:{}};
  for(const k in st.pressed){if(st.pressed[k]>0)inp.pressed[k]=1;st.pressed[k]-=dt;if(st.pressed[k]<=0)delete st.pressed[k]}
  for(const k in st.dbl){if(st.dbl[k]>0)inp.dbl[k]=1;st.dbl[k]-=dt;if(st.dbl[k]<=0)delete st.dbl[k]}
  // a direction let go a split second before the button still counts (↓+2, →+4 ...)
  if(LIMBS.some(b=>inp.pressed[b]))for(const d of ['down','left','right'])if(!inp[d]&&now()-(st.rel[d]||-9)<.09)inp[d]=1;
  // 1+3 pressed together = throw
  if(inp.pressed.lp&&inp.pressed.lk&&Math.abs((st.at.lp||0)-(st.at.lk||0))<.08){inp.pressed.g=1;delete st.pressed.lp;delete st.pressed.lk}
  return inp}
function localKey(k,down){
  if(down)press(LOCAL,k);else release(LOCAL,k);
  lightPad(k,down);
  if(NET.role==='guest')netSend({t:'k',k,d:down?1:0});
}
const CODEMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Digit1:'lp',Digit2:'rp',Digit3:'lk',Digit4:'rk',Numpad1:'lp',Numpad2:'rp',Numpad3:'lk',Numpad4:'rk'};
const KEYMAP={a:'left',q:'left',d:'right',w:'up',z:'up',s:'down',u:'lp',i:'rp',j:'lk',k:'rk',l:'s',o:'g',h:'x'};
const byCode={};
function lightPad(k,on){const b=document.querySelector('.pad [data-k="'+k+'"]');if(b)b.classList.toggle('down',!!on)}
function releaseAll(){for(const k in LOCAL.held)if(LOCAL.held[k])localKey(k,0)}
addEventListener('keydown',e=>{
  if(!$('card').hidden){
    if(e.target&&e.target.tagName==='TEXTAREA')return;
    if(paused&&(e.code==='Escape'||e.key==='p')){e.preventDefault();resume();return}
    if(e.code==='Enter'||e.code==='Space'){if(document.activeElement&&/BUTTON/.test(document.activeElement.tagName))return;const g=document.querySelector('#panel .go:not(.ghost):not(:disabled)');if(g){e.preventDefault();g.click()}}
    return}
  if(e.code==='Escape'||e.key==='p'){if(p1&&!$('pausebtn').hidden){e.preventDefault();openPause()}return}
  const k=CODEMAP[e.code]||KEYMAP[(e.key||'').toLowerCase()];
  if(k){e.preventDefault();if(!e.repeat){byCode[e.code]=k;localKey(k,1)}}});
addEventListener('keyup',e=>{const k=byCode[e.code]||CODEMAP[e.code]||KEYMAP[(e.key||'').toLowerCase()];if(k&&LOCAL.held[k]){localKey(k,0)}delete byCode[e.code]});

// d-pad: one touch zone read like a stick, so you can roll the thumb from back to down-back to down
// without lifting it (diagonals included), instead of four separate buttons
(()=>{const z=$('dpad');let pid=null;const dirs=['left','right','up','down'];
  const setDirs=(want)=>{for(const k of dirs){const on=want.includes(k);if(on&&!LOCAL.held[k])localKey(k,1);else if(!on&&LOCAL.held[k])localKey(k,0)}};
  const read=e=>{const r=z.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,dead=r.width*.13;
    if(Math.hypot(dx,dy)<dead)return setDirs([]);
    const a=Math.atan2(dy,dx)*180/Math.PI,w=[];// 8 sectors of 45 degrees
    if(a>-67.5&&a<67.5)w.push('right');if(a>112.5||a<-112.5)w.push('left');if(a>22.5&&a<157.5)w.push('down');if(a<-22.5&&a>-157.5)w.push('up');setDirs(w)};
  z.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;try{z.setPointerCapture(pid)}catch(_){}read(e)});
  z.addEventListener('pointermove',e=>{if(e.pointerId===pid)read(e)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;setDirs([])};
  z.addEventListener('pointerup',end);z.addEventListener('pointercancel',end);z.addEventListener('lostpointercapture',end)})();
// buttons: one touch zone where each finger goes to the nearest button, so there are no dead gaps
// between them and a thumb can roll from 1 onto 2 (or 3) without lifting
(()=>{const z=$('btns'),own=new Map(),cnt={};
  const nearest=e=>{let best=null,bd=1e9;for(const b of z.querySelectorAll('span')){if(b.hidden)continue;const r=b.getBoundingClientRect();if(!r.width)continue;
    const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))/(r.width/2);if(d<bd){bd=d;best=b.dataset.k}}return bd<1.7?best:null};
  const set=(id,k)=>{const old=own.get(id);if(old===k)return;
    if(old){cnt[old]--;if(!cnt[old]&&LOCAL.held[old])localKey(old,0)}
    if(k){cnt[k]=(cnt[k]||0)+1;if(cnt[k]===1){localKey(k,1);if(SET.buzz&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}}own.set(id,k)}else own.delete(id)};
  z.addEventListener('pointerdown',e=>{e.preventDefault();try{z.setPointerCapture(e.pointerId)}catch(_){}set(e.pointerId,nearest(e))});
  z.addEventListener('pointermove',e=>{if(own.has(e.pointerId)||e.buttons)set(e.pointerId,nearest(e))});
  const end=e=>set(e.pointerId,null);
  z.addEventListener('pointerup',end);z.addEventListener('pointercancel',end);z.addEventListener('lostpointercapture',end)})();

let ac=null,NOISE=null;
function tone(f1,f2,d,type,v,noise){if(!SET.sound)return;if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  if(noise){if(!NOISE){NOISE=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const ch=NOISE.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    // one shared noise buffer: building a fresh one on every hit made the garbage collector pause mid-fight
    const s=ac.createBufferSource();s.buffer=NOISE;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=f1;s.connect(f);f.connect(g);s.start(t,Math.random()*.4);s.stop(t+d+.02)}
  else{const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+d);o.connect(g);o.start(t);o.stop(t+d)}}
const SFX={
  hit:()=>{tone(900,0,.12,'',.18,1);tone(160,60,.1,'square',.08)},
  heavy:()=>{tone(600,0,.25,'',.25,1);tone(110,40,.25,'sawtooth',.12)},
  counter:()=>{tone(1200,300,.2,'square',.08);tone(700,0,.2,'',.2,1)},
  block:()=>tone(1400,900,.06,'square',.06),
  special:()=>tone(300,1200,.25,'triangle',.1),
  proj:()=>tone(500,180,.3,'sawtooth',.06),
  super:()=>{tone(150,900,.7,'sawtooth',.1);tone(80,80,.7,'',.2,1)},
  bell:()=>{tone(880,870,.6,'sine',.12);tone(1320,1300,.6,'sine',.06)},
  whoosh:()=>tone(1800,0,.12,'',.06,1),
  swish:()=>tone(2600,0,.05,'',.025,1),
  grab:()=>{tone(220,140,.12,'square',.06);tone(400,0,.1,'',.1,1)},
  land:()=>tone(300,0,.08,'',.05,1),
  trumpet:()=>{tone(260,780,.35,'sawtooth',.08);tone(390,1100,.4,'square',.04);setTimeout(()=>tone(180,60,.3,'',.25,1),120)},
  darbuka:()=>{tone(180,70,.18,'sine',.25);setTimeout(()=>tone(2600,0,.05,'',.12,1),110);setTimeout(()=>tone(2600,0,.05,'',.12,1),190)},
};

const TN_PAT=[
  [/^(\d+) HIT COMBO$/,m=>m[1]+' DARBAT'],[/^(\d+) HIT JUGGLE$/,m=>m[1]+' DARBAT FIL HWA'],
  [/^ROUND (\d+)$/,m=>'ROUND '+m[1]],[/^STAGE (\d+) OF (\d+)$/,m=>'MAR7LA '+m[1]+' MEN '+m[2]],
  [/^Dummy: (.+)$/,m=>'Dummy: '+T(m[1])],[/^Meter: (.+)$/,m=>'Jauge: '+(m[1]==='Normal'?'3adia':T(m[1]))],
  [/^Sound: (.+)$/,m=>'Sout: '+T(m[1])],[/^Vibration: (.+)$/,m=>'Rja7a: '+T(m[1])],[/^Button size: (.+)$/,m=>'9ad el boutonet: '+T(m[1])],
  [/^D-pad on the (.+)$/,m=>'El D-pad 3al '+T(m[1])],
  [/^Your friend picked (.+)\.$/,m=>'Sa7bek 5tar '+m[1]+'.'],
  [/^Special: (.+)$/,m=>'Special: '+T(m[1])],[/^SUPER: (.+)$/,m=>'SUPER: '+T(m[1])],
  [/^LAST BREATH: (.+?)\. (.+)$/,m=>'A5ER NAFES: '+T(m[1])+'. '+T(m[2])],
  [/^DUMMY: (.+) · LAST COMBO:$/,m=>'DUMMY: '+T(m[1].charAt(0)+m[1].slice(1).toLowerCase()).toUpperCase()+' · A5ER COMBO:'],
  [/^(.+) · (.+)$/,m=>T(m[1])+' · '+T(m[2])],
  [/^Stage (\d+) of (\d+) cleared\. Next up:$/,m=>'Kammalt el mar7la '+m[1]+' men '+m[2]+'. Elli ba3dou:'],
  [/^from (.+), at (.+)\.$/,m=>'men '+T(m[1])+', fi '+T(m[2])+'.'],
  [/^(.+) stops you at stage (\d+) of (\d+)\. Continue\?$/,m=>m[1]+' w9fek fil mar7la '+m[2]+' men '+m[3]+'. Tkammel?'],
  [/^(.+) takes it (\d+)–(\d+)\. Yezzi, go again\.$/,m=>m[1]+' rbe7 '+m[2]+'–'+m[3]+'. Yezzi, 3awed.'],
  [/^HITS,$/,()=>'DARBAT,'],[/^DMG$/,()=>'DARR'],
  [/^ONLINE (\d+)MS$/,m=>'ONLINE '+m[1]+'MS'],
];
let LANG='tn';
function T(s){
  if(LANG!=='tn'||typeof s!=='string')return s;
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  let r=TN[core];
  if(r===undefined&&core.endsWith('!')&&TN[core.slice(0,-1)]!==undefined)r=TN[core.slice(0,-1)]+'!';
  if(r===undefined)for(const[re,f] of TN_PAT){const mm=core.match(re);if(mm){r=f(mm);break}}
  return r===undefined?s:m[1]+r+m[3];
}

  return g}

/* ---- Café M'Rabet, Medina of Tunis: founded at the start of the 17th century (oldest café in Tunisia),
   known for its large central banquette and its columns. Old men play chkobba over mint tea. ---- */
function seatedMan(x,y,face,robe,slap,t){
  // cross-legged on the mat; slap: 0..1 arm animation for slapping a card down
  ctx.fillStyle=shade(robe,.8);ctx.beginPath();ctx.ellipse(x,y-4,20,7,0,0,7);ctx.fill();
  ctx.fillStyle=robe;ctx.beginPath();ctx.moveTo(x-13,y-6);ctx.lineTo(x+13,y-6);ctx.lineTo(x+9,y-40);ctx.lineTo(x-9,y-40);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b98a62';ctx.beginPath();ctx.arc(x+face*1,y-48,8,0,7);ctx.fill();
  ctx.fillStyle='#d9d4c8';ctx.fillRect(x+face*3-(face>0?0:6),y-45,6,2);
  ctx.fillStyle='#8e1b28';ctx.fillRect(x-7,y-58,14,8);ctx.fillStyle='#6e1520';ctx.fillRect(x-7,y-52,14,2);
  const ang=slap>0?(slap<.5?-1.9+slap*2:-.9-(slap-.5)*.5):-.5;   // raise, then slam down
  ctx.strokeStyle=robe;ctx.lineWidth=6;ctx.lineCap='round';const sx=x+face*6,sy=y-36;
  const ex=sx+Math.cos(ang)*face*16,ey=sy-Math.sin(-ang)*-14+(slap>.5?10:0);
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='#b98a62';ctx.beginPath();ctx.arc(ex,ey,3,0,7);ctx.fill();
  if(slap>0&&slap<.55){ctx.fillStyle='#fff';ctx.fillRect(ex-3,ey-8,7,10);ctx.fillStyle=RED;ctx.fillRect(ex-1,ey-5,3,3)}
}

const fr=i=>{const x=Math.sin(i*91.7+12.3)*43758.5453;return x-Math.floor(x)};
function grade(top,bottom,a){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=a;const g=ctx.createLinearGradient(0,0,0,SH);g.addColorStop(0,top);g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fillRect(-300,-200,SW+600,SH+400);ctx.restore()}
function rays(x,y,col,n,len,spread,t,a){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(x,y);ctx.fillStyle=col;
  for(let i=0;i<n;i++){const ang=-Math.PI/2+(i-(n-1)/2)*spread+Math.sin(t*.25+i)*.03;ctx.globalAlpha=a*(.55+.45*Math.sin(t*.6+i*1.7));
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang-.04)*len,Math.sin(ang-.04)*len);ctx.lineTo(Math.cos(ang+.04)*len,Math.sin(ang+.04)*len);ctx.fill()}ctx.restore()}
function beams(x0,col,t,a){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=col;
  for(let i=0;i<4;i++){const x=x0+i*190,w=46+fr(i)*30;ctx.globalAlpha=a*(.6+.4*Math.sin(t*.5+i*2));ctx.beginPath();ctx.moveTo(x,-40);ctx.lineTo(x+w,-40);ctx.lineTo(x+w+150,GROUND);ctx.lineTo(x+150,GROUND);ctx.fill()}ctx.restore()}
function motes(n,col,t,y0,y1,drift,size){ctx.fillStyle=col;for(let i=0;i<n;i++){const x=((fr(i)*(SW+200)+t*drift*(.5+fr(i+3)))%(SW+200))-100,y=y0+((fr(i+7)*(y1-y0)+Math.sin(t*.8+i)*12+t*6*fr(i+1))%(y1-y0));

const LV={skill:[0,.12,.3,.45,.58,.7],speed:[0,.85,1.15,1.45,1.7,1.95],chain:[0,.35,.6,.8,.9,.95],jug:[0,.03,.08,.14,.2,.26],brk:[0,.1,.3,.5,.65,.8]};
function canSpecial(f){return f.meter>=50&&!(f.def.sp.kind==='proj'&&projs.some(p=>p.owner===f))}
function dummyInput(me){
  const back=me.face===1?'left':'right',m=train.dummy,inp={pressed:{},dbl:{}};
  if(m==='block'||m==='cblock')inp[back]=1;if(m==='cblock')inp.down=1;if(m==='jump'&&me.y<=0)inp.up=1;
  return inp;
}
function cpuInput(me,op,dt){
  const inp={pressed:{},dbl:{}},D=me.def,lv=cpuLevel;
  const fwd=me.face===1?'right':'left',back=me.face===1?'left':'right';
  const dist=Math.abs(op.x-me.x);
  ai.think-=dt;ai.holdT-=dt;
  // break throws
  if(me.state==='thrown'){if(!me.aiTry2&&me.t>.08){me.aiTry2=1;if(Math.random()<LV.brk[lv])inp.pressed.lp=1}return inp}
  // continue strings
  if(me.state==='attack'&&me.aiTry!==me.serial&&me.t>=me.atk.s*.5){
    me.aiTry=me.serial;const opts=LIMBS.filter(b=>chainOf(me,b));
    if(opts.length&&Math.random()<LV.chain[lv]){inp.pressed[pick(opts)]=1;return inp}
  }
  // juggle a launched opponent
  if(op.state==='down'&&op.y>14&&op.jug<3&&dist<115&&['idle','walk','crouch'].includes(me.state)&&Math.random()<LV.jug[lv]*8){inp.pressed[Math.random()<.6?'lp':'rk']=1;return inp}
  if(me.state==='air'){
    if(D.tech==='djump'&&!me.dj&&me.vy<0&&Math.random()<.04)inp.pressed.up=1;
    if(D.tech==='airdash'&&!me.ad&&Math.random()<.05)inp.pressed[dist>120?fwd:back]=1;
    if(D.tech==='float'&&Math.random()<.6)inp.up=1;
  }
  if(ai.holdT>0)Object.assign(inp,ai.hold);
  const skill=LV.skill[lv],speed=LV.speed[lv];
  const trap=projs.find(p=>p.owner===op&&(p.kind==='trap'||p.kind==='jar')&&!p.done&&Math.abs(p.x-me.x)<p.r+30);
  if(trap&&me.y<=0&&['idle','walk','crouch','run','block'].includes(me.state)&&Math.random()<skill){const away=me.x>trap.x?'right':'left';
    if(Math.random()<.5){inp.up=1;inp[away]=1}else{ai.hold={[away]:1};ai.holdT=.4;Object.assign(inp,ai.hold)}return inp}
  const threat=(op.state==='attack'&&op.atk&&op.t<op.atk.s+.02&&dist<(op.atk.range||300)+30)||projs.some(p=>p.owner===op&&Math.abs(p.x-me.x)<160);
  if(threat&&ai.holdT<=0&&Math.random()<skill*dt*14){
    if(D.tech==='roll'&&Math.random()<.4){inp.dbl[fwd]=1;return inp}
    const h=op.atk&&op.atk.h;
    ai.hold={[back]:1,down:h==='low'||(h==='high'&&Math.random()<.5)?1:0};ai.holdT=.35;Object.assign(inp,ai.hold);return inp;
  }
  if(ai.holdT>0||ai.think>0)return inp;
  if(!['idle','walk','crouch','run'].includes(me.state))return inp;
  const sp=D.sp;
  if(canArt(me)&&mode!=='training'){const A=ARTS[D.id],ok=A.type==='grab'?dist<80:A.type==='rush'?dist<300:A.type==='parry'?dist<200:A.type==='trap'&&A.at==='aim'?dist<330:dist>120;
    if(ok&&Math.random()<.35*skill){inp.pressed.x=1;ai.think=rand(.5,.9)/speed;return inp}}
  if(canSpecial(me)){
    if(sp.kind==='proj'&&dist>170&&Math.random()<.5){inp.pressed.s=1;ai.think=rand(.4,.8)/speed;return inp}
    if(sp.kind==='lash'&&dist>100&&dist<230&&Math.random()<.4){inp.pressed.s=1;ai.think=rand(.4,.8)/speed;return inp}
    if(sp.kind==='teleport'&&Math.random()<.25){inp.pressed.s=1;ai.think=rand(.4,.8)/speed;return inp}
    if((sp.kind==='rush'||sp.kind==='slide')&&dist<260&&dist>90&&Math.random()<.35){inp.pressed.s=1;ai.think=rand(.4,.8)/speed;return inp}
  }
  if(dist>110){
    const r=Math.random();
    if((D.tech==='dash'||D.tech==='roll'||D.tech==='shuffle')&&dist>200&&r<.25){inp.dbl[fwd]=1}
    else if(r<.14){ai.hold={[fwd]:1,up:1};ai.holdT=.12}
    else{ai.hold={[fwd]:1};ai.holdT=rand(.15,D.tech==='run'?.8:.4)}
    ai.think=rand(.05,.2)/speed;
  }else{
    const r=Math.random(),cmds=Object.keys(D.cmd),guarding=op.blocking&&!op.crouch&&op.state!=='attack';
    if(canSpecial(me)&&r<.12)inp.pressed.s=1;
    else if(guarding&&r<.3)inp.pressed.g=1;
    else if(cmds.length&&r<.24){const c=cmds[0];inp[c[0]==='f'?fwd:back]=1;inp.pressed[LIMBS[+c[1]-1]]=1}
    else if(r<.34){inp.down=1;inp.pressed.rp=1}

    else if(r<.7){inp.down=1;inp.pressed[pick(['lk','rk','lp'])]=1}
    else if(r<.8)inp.pressed.g=1;
    else if(r<.9){ai.hold={[back]:1};ai.holdT=rand(.2,.45)}
    else{ai.hold={[back]:1,down:1};ai.holdT=.3}
    ai.think=rand(.25,.55)/speed;
  }
  return inp;
}

function updateProjs(dt){

  for(const p of projs)for(const q of projs)if(p!==q&&!p.dead&&!q.dead&&!p.still&&!q.still&&p.owner!==q.owner&&Math.abs(q.x-p.x)<p.r+q.r&&Math.abs(q.y-p.y)<p.r+q.r){if(p.heavy&&!q.heavy)q.dead=1;else if(q.heavy&&!p.heavy)p.dead=1;else p.dead=q.dead=1;spark((p.x+q.x)/2,q.heavy?q.y:p.y,FG,14)}
  for(const p of projs){
    if(p.dead)continue;
    const tgt=p.owner===p1?p2:p1,top=GROUND-(tgt.crouch?95:140)-tgt.y,bot=GROUND-tgt.y;
    const jug=(p.kind==='elephant'||p.rain)&&tgt.state==='down'&&tgt.y>4&&tgt.jug<4;
    if(p.kind==='elephant'&&Math.random()<.3)puff(p.x-Math.sign(p.vx)*30,GROUND-4,-Math.sign(p.vx)*rand(40,140),rand(-60,-10),.35,'#d9c6a0',4);
    if(p.kind==='trap'||p.kind==='jar'){
      if(p.kind==='jar'){const u=Math.min(1,p.t/p.fuse);p.x=p.x0+(p.tx-p.x0)*u;p.y=GROUND-120+(80*u)-Math.sin(Math.PI*u)*150}
      if(!p.done&&p.t>=p.fuse){p.done=1;
        if(Math.abs(tgt.x-p.x)<p.r&&tgt.y<24&&tgt.inv<=0&&!evading(tgt)&&!['ko','down','thrown'].includes(tgt.state))applyHit(p.owner,tgt,p.m,p.owner.face,tgt.x,GROUND-80,false);
        else{fx('sh',8);play('heavy');spark(p.x,GROUND-20,p.kind==='jar'?'#c9764a':p.owner.def.hud,16,24)}}
      if(p.t>p.fuse+.4)p.dead=1;
      continue}
    if(p.kind==='storm'&&p.t>3.4)p.dead=1;
    if(tgt.state==='attack'&&tgt.atk&&tgt.atk.art&&tgt.atk.type==='parry'&&tgt.t>=tgt.atk.s&&tgt.t<=tgt.atk.s+tgt.atk.a&&Math.abs(p.x-tgt.x)<p.r+20&&!p.heavy){p.dead=1;fx('cd',Math.round(tgt.x+tgt.face*20),GROUND-100,4,'up',tgt.face);say({txt:'CAUGHT',t:.6,size:26,y:180,col:GOLD,x:Math.round(tgt.x)});continue}
    if(!p.spent&&tgt.inv<=0&&!evading(tgt)&&(jug||!['down','ko','thrown'].includes(tgt.state))&&Math.abs(p.x-tgt.x)<p.r+16&&p.y+p.r>top&&p.y-p.r<bot){if(p.kind==='slipper'&&!p.rain){p.spent=1;p.vx=-p.d0*Math.max(300,Math.abs(p.vx))}else p.dead=1;applyHit(p.owner,tgt,p.m,Math.sign(p.vx)||p.owner.face,p.kind==='elephant'?tgt.x:p.x,p.kind==='elephant'?p.y-20:p.y,jug)}
    if((p.vx>0&&p.x>SW+160)||(p.vx<0&&p.x<-160))p.dead=1;
    if(p.rain&&p.y>GROUND-6){p.dead=1;puff(p.x,GROUND-4,rand(-60,60),rand(-80,-20),.3,'#d9c6a0',4)}
    if(p.kind==='slipper'&&!p.rain&&((p.t>.4&&Math.sign(p.vx)===-p.d0&&Math.abs(p.x-p.owner.x)<34)||p.t>3))p.dead=1;
  }
  projs=projs.filter(p=>!p.dead);
}

/* =====================================================================
   NETWORK  (Wi-Fi / hotspot, no internet needed)

   The host runs the whole fight; the guest sends button presses and
   draws the host's snapshots.
   ===================================================================== */
const NET={online:0,peer:null,rtt:0,role:null,pc:null,ctl:null,st:null,evq:[],inMatch:false,guestPick:null,myPick:null,stream:null,scanTimer:0,lastSnap:0};

async function packDesc(desc){
  // keep only IPv4 UDP candidates: that is all a hotspot needs, and it keeps the QR small
  const sdp=desc.sdp.split('\r\n').filter(l=>{if(!l.startsWith('a=candidate'))return true;const p=l.split(' ');return p[2].toLowerCase()==='udp'&&!p[4].includes(':')}).join('\r\n');

function gathered(pc){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const t=setTimeout(res,3000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})})}
async function primeCamera(){

  try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});return s}catch(e){return null}
}
function netSend(o){try{if(NET.ctl&&NET.ctl.readyState==='open')NET.ctl.send(JSON.stringify(o))}catch(_){}}
function netClose(){
  stopScan();
  try{NET.ctl&&NET.ctl.close()}catch(_){}try{NET.st&&NET.st.close()}catch(_){}try{NET.pc&&NET.pc.close()}catch(_){}try{NET.peer&&NET.peer.destroy()}catch(_){}

let connectedOnce=false;

    // heartbeat: a phone that goes quiet for 6 seconds has gone (mobile networks don't always say so)

/* ---- ONLINE: play over mobile data or any internet, with a 5-letter room code.
   A free public matchmaking server (PeerJS) only introduces the two phones; the
   match itself is a direct phone-to-phone link, relayed through a TURN server
   when the mobile network blocks a direct one. The host still runs the fight. */
const ROOM_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',ROOM_PREFIX='rooftoprumble-v1-';
const PEER_OPTS=()=>Object.assign({debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}},window.__PEEROPTS||{});

function roomCode(){let c='';const r=new Uint32Array(5);crypto.getRandomValues(r);for(const v of r)c+=ROOM_ABC[v%ROOM_ABC.length];return c}
function wrapConn(c){const w={c,get readyState(){return c.open?'open':'connecting'},send:d=>{try{c.send(d)}catch(_){}},close:()=>{try{c.close()}catch(_){}}};
  c.on('data',d=>w.onmessage&&w.onmessage({data:d}));c.on('open',()=>w.onopen&&w.onopen());
  c.on('close',()=>{if(NET.role&&(NET.ctl===w||NET.st===w))lostConnection()});c.on('error',()=>{});return w}
function peerError(e){
  const why={'network':'This phone can\'t reach the internet. Turn on mobile data or Wi-Fi and try again.','server-error':'The matchmaking server didn\'t answer. Try again in a moment.',
    'socket-error':'The matchmaking server didn\'t answer. Try again in a moment.','peer-unavailable':'No room with that code. Check the letters with your friend; the host must keep the room screen open.',
    'browser-incompatible':'This phone\'s web view can\'t do online matches.'}[e&&e.type]||'Something went wrong connecting. Try again.';
  netClose();showPanel(`<h2>COULDN'T CONNECT</h2><p class="warn">${why}</p><div class="row"><button class="go" id="back">Back</button></div>`);$('back').onclick=netMenu}
function onlineHost(tries=0){
  netClose();connectedOnce=false;NET.role='host';mode='net';NET.online=1;
  showPanel(`<h2>ONLINE ROOM</h2><p class="status" id="st">Opening a room…</p><div class="row"><button class="go ghost" id="back">Cancel</button></div>`);$('back').onclick=()=>{netClose();netMenu()};
  const code=roomCode(),peer=new Peer(ROOM_PREFIX+code,PEER_OPTS());NET.peer=peer;
  peer.on('open',()=>{if(NET.peer!==peer)return;
    showPanel(`<h2>ONLINE ROOM</h2><p>Send this code to your friend. On their phone: VS FRIEND → Join online room.</p>
      <div class="roomcode" id="rc">${code}</div>
      <div class="row"><button class="go ghost" id="share" type="button">Share code</button><button class="go ghost" id="back">Cancel</button></div>
      <p class="status" id="st">Waiting for your friend… keep this screen open.</p>`);
    $('back').onclick=()=>{netClose();netMenu()};
    $('share').onclick=()=>{const t=`Join my Rooftop Rumble room: ${code}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyText(code,null),setStatus('Code copied.')}});

    if(conn.label==='ctl'){if(NET.ctl){conn.close();return}NET.ctl=wrapConn(conn)}else{if(NET.st){conn.close();return}NET.st=wrapConn(conn)}
    setStatus('Your friend is connecting…');if(NET.ctl&&NET.st)wireChannels()});

}
function onlineJoin(){
  netClose();mode='net';
  showPanel(`<h2>JOIN ONLINE ROOM</h2><p>Type the 5-letter code from the host's phone.</p>
    <input class="roomin" id="room" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCDE">
    <p class="status" id="st"></p><div class="row"><button class="go ghost" id="back">Back</button><button class="go" id="go">Join</button></div>`);

    connectedOnce=false;NET.role='guest';NET.online=1;setStatus('Finding the room…');$('go').disabled=true;
    const peer=new Peer(PEER_OPTS());NET.peer=peer;

function copyText(t,ta){try{navigator.clipboard.writeText(t).catch(()=>{ta&&ta.select()})}catch(_){ta&&ta.select()}}

  const q=qrcode(0,'L');q.addData(text,'Byte');q.make();
  const n=q.getModuleCount(),cell=Math.max(3,Math.floor(600/(n+8))),size=cell*(n+8);
  canvas.width=canvas.height=size;const g=canvas.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#000';

async function scanScreen(title,hint,onCode,onCancel){

function stopScan(){clearTimeout(NET.scanTimer);if(NET.stream){NET.stream.getTracks().forEach(t=>t.stop());NET.stream=null}}

// ---- lobby over the connection
function onCtl(m){
  NET.heard=performance.now();
  switch(m.t){
    case 'k':if(NET.role==='host'){if(m.d)press(REMOTE,m.k);else release(REMOTE,m.k)}break;
    case 'pick':NET.guestPick=m.c;if(NET.role==='host'&&NET.myPick!=null&&phase==='lobby')netSelectStage();else setStatus(`Your friend picked ${CHARS[m.c].name}.`);break;
    case 'start':mode='net';newMatch(CHARS[m.a],CHARS[m.b],m.st);phase='intro';break;
    case 'ev':for(const e of m.e)FX[e[0]]&&FX[e[0]](...e.slice(1));break;
    case 'select':netSelectFighter();break;
    case 'result':showResult();break;
    case 'bye':lostConnection();break;
    case 'ping':netSend({t:'pong',at:m.at});break;
    case 'pong':NET.rtt=Math.round(performance.now()-m.at);break;
  }
}
function netSelectFighter(){
  NET.inMatch=false;NET.myPick=null;if(NET.role==='host')NET.guestPick=null;
  phase='lobby';hideMatchUI();

  else if(NET.guestPick!=null)netSelectStage();

}

  const a=NET.myPick,b=NET.guestPick;
  netSend({t:'start',a,b,st:pickStage});mode='net';newMatch(CHARS[a],CHARS[b],pickStage);
}

// ---- snapshots: host -> guest every frame
const STATES=['idle','walk','run','crouch','air','attack','hit','block','down','ko','win','dash','roll','throw','thrown','blink'];
const HH=['high','mid','low'];

/* =====================================================================
   MAIN UPDATE
   ===================================================================== */
function update(dt,realDt){
  if(paused)return;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t-=dt||realDt*.5;if(s.ring)s.r+=300*(dt||realDt*.3);else if(s.card){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.95;s.vy=s.vy*.95+900*dt;s.rot+=s.vr*dt}else if(!s.flash){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.88;s.vy*=.88}if(s.t<=0)sparks.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){texts[i].t-=realDt;if(texts[i].t<=0)texts.splice(i,1)}
  shake*=Math.pow(.004,realDt);crowd=Math.max(0,crowd-realDt*.5);
  if(!p1||!['intro','fight','ko'].includes(phase))return;
  if(NET.role==='guest'){
    // between host updates, keep everything moving along its last known path, so Wi-Fi hiccups
    // don't freeze the picture; the next update from the host corrects any drift
    if(dt>0&&superFreeze<=0&&performance.now()-(NET.snapAt||0)<150){
      for(const f of [p1,p2]){f.t+=dt;if(f.state==='thrown')continue;f.x=clamp(f.x+f.vx*dt,40,SW-40);
        if(f.y>0||f.vy>0){const g=f.floating?380:f.adT>0?300:f.state==='down'?1100:1700;f.y=Math.max(0,f.y+f.vy*dt);f.vy-=g*dt}}
      for(const q of projs){if(!q.still)q.x+=q.vx*dt;q.t+=dt}
      if(gcine)gcine.t+=dt;
    }
    return}
  if(superFreeze>0){superFreeze-=realDt;flushNet();return}
  if(cine){runCine(dt);for(const f of [p1,p2])f.lag+=(f.hp-f.lag)*Math.min(1,dt*1.2);flushNet();return}
  phaseT+=dt;
  if(phase==='intro'&&phaseT>1.3&&!texts.some(t=>t.txt==='YALLA!')&&phaseT<1.5){say({txt:'YALLA!',t:.8,size:96,y:210,col:GOLD});play('bell')}
  if(phase==='intro'&&phaseT>1.6){phase='fight';phaseT=0}
  if(phase==='fight'&&mode!=='training'){timer-=dt;if(timer<=0){timer=0;const w=p1.hp===p2.hp?null:p1.hp>p2.hp?p1:p2;endRound(w,w===p1?p2:p1)}}
  if(phase==='ko'&&phaseT>2.6){const w=p1.hp>p2.hp?p1:p2.hp>p1.hp?p2:null;if(w&&w.state!=='down')w.state='win';if(phaseT>3.6){afterRound();flushNet();return}}
  for(const[f,o] of [[p1,p2],[p2,p1]])if(['idle','walk','crouch','run'].includes(f.state)&&f.y<=0)f.face=o.x>f.x?1:-1;
  const i1=readInput(LOCAL,dt);
  const i2=p2.ctrl==='cpu'?(phase==='fight'?cpuInput(p2,p1,dt):{pressed:{},dbl:{}}):p2.ctrl==='dummy'?dummyInput(p2):readInput(REMOTE,dt);

  const tm=mode==='training'?'∞':String(Math.ceil(timer));if(hudC.tm!==tm){hudC.tm=tm;$('timer').textContent=tm}
  for(const[f,id] of [[p1,'p1'],[p2,'p2']]){
    setW(id+'hp',f.hp);setW(id+'lag',f.lag);setW(id+'mi',f.meter);
    const ms=f.meter>=100?2:f.meter>=50?1:0;if(hudC[id+'ms']!==ms){hudC[id+'ms']=ms;$(id+'m').classList.toggle('half',ms===1);$(id+'m').classList.toggle('full',ms===2)}
    const ca=canArt(f)&&!cine;if(hudC[id+'ca']!==ca){hudC[id+'ca']=ca;$(id+'m').classList.toggle('art',ca)}
    const w=(f.wins>0?1:0)+(f.wins>1?1:0);if(hudC[id+'w']!==w){hudC[id+'w']=w;$(id+'w').innerHTML='<i class="pip'+(w>0?' on':'')+'"></i><i class="pip'+(w>1?' on':'')+'"></i>'}
  }
}

let last=performance.now();
// 120 Hz phones: run at a steady 60 instead of dropping frames unevenly between 120 and 60
let hzN=0,hzSum=0,half=false,odd=false;
function loop(t){
  if(hzN<40){const d=t-last;if(d>2&&d<40){hzSum+=d;hzN++;if(hzN===40)half=hzSum/hzN<9.5}}
  if(half){odd=!odd;if(odd){requestAnimationFrame(loop);return}}
  let dt=Math.min(.033,(t-last)/1000);last=t;const realDt=dt;FDT=realDt;
  if(paused)dt=0;
  if(hitstop>0){hitstop-=dt;dt=0}
  if(slowmo>0&&!paused){slowmo-=realDt;dt*=.3}
  update(dt,realDt);draw(NET.role==='guest'?realDt:dt);hud();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();if(p1&&mode!=='net'&&$('card').hidden&&['intro','fight'].includes(phase))openPause()}});
menu();requestAnimationFrame(loop);
})();
</script>
